// Wear OS companion app for Teamder.
//
// Pure native (Kotlin + Compose for Wear OS). Shares the phone app's
// applicationId (com.studiogameslime.soccerapp) so Google Play treats it
// as the watch variant of the SAME app (multi-APK). It is NOT a React
// Native module — it does not apply the com.facebook.react plugin, so it
// has zero effect on the phone build.
//
// Versions are pinned to match the project: AGP 8.8.2 + Kotlin 2.0.21
// come from the root buildscript classpath (managed by expo-root-project);
// the Compose compiler plugin is added to THIS module's classpath only.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Kotlin 2.0 ships the Compose compiler as a separate plugin. Pin it
    // to the project's Kotlin version. Scoped to this module so the phone
    // build is untouched.
    classpath(
      "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.0.21"
    )
  }
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

import java.nio.file.Paths

android {
  // Distinct namespace (R / BuildConfig package) but SAME applicationId
  // as the phone — that's what makes it the "watch version" in Play.
  namespace "com.studiogameslime.soccerapp.wear"
  compileSdk 35

  defaultConfig {
    applicationId "com.studiogameslime.soccerapp"
    minSdk 30        // Wear OS 3 — Galaxy Watch 4 and up
    targetSdk 34
    // Wear uses its own high versionCode range so it never collides with
    // the phone app (phone is ~45 and auto-increments). Bump +1 each
    // new watch release.
    versionCode 1019
    versionName "1.0.22"
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }

  // ── Release signing ─────────────────────────────────────────────────
  // EAS prepares `credentials.json` at the build's working dir + injects
  // a signing config into android/app/build.gradle. It does NOT touch
  // the wear module — so a default `:wear:bundleRelease` ends up signed
  // with the debug key and Play Console rejects it ("חבילות חייבות
  // להיות חתומות"). Mirror the EAS template here, gated on the env var
  // so manual local debug builds (no EAS) still work without crashing.
  if (System.getenv("EAS_BUILD_WORKINGDIR")) {
    signingConfigs {
      release {
        def credentialsJson = Paths.get(System.getenv("EAS_BUILD_WORKINGDIR")).resolve("credentials.json").toFile()
        def credentials = new groovy.json.JsonSlurper().parse(credentialsJson)
        def keystorePath = Paths.get(credentials.android.keystore.keystorePath)

        storeFile keystorePath.toFile()
        storePassword credentials.android.keystore.keystorePassword
        keyAlias credentials.android.keystore.keyAlias
        if (credentials.android.keystore.containsKey("keyPassword")) {
          keyPassword credentials.android.keystore.keyPassword
        } else {
          // PKCS keystores don't have a key password; reuse the store
          // password to satisfy Gradle's requirement (same trick the
          // EAS template uses for the phone app).
          keyPassword credentials.android.keystore.keystorePassword
        }
      }
    }
  }

  buildTypes {
    debug {}
    release {
      minifyEnabled false
      if (System.getenv("EAS_BUILD_WORKINGDIR")) {
        signingConfig signingConfigs.release
      }
    }
  }
}

dependencies {
  implementation platform("androidx.compose:compose-bom:2024.09.00")
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.ui:ui-tooling-preview"
  debugImplementation "androidx.compose.ui:ui-tooling"
  implementation "androidx.activity:activity-compose:1.9.2"
  implementation "androidx.core:core-ktx:1.13.1"

  // Compose for Wear OS
  implementation "androidx.wear.compose:compose-material:1.4.0"
  implementation "androidx.wear.compose:compose-foundation:1.4.0"
  // Core Material icons (PlayArrow / Pause / Refresh) for the stopwatch
  // control buttons. BOM-versioned. The "core" set ships these three; we
  // deliberately avoid material-icons-extended (huge) since we need only
  // a handful.
  implementation "androidx.compose.material:material-icons-core"

  // Wearable Data Layer — receives state relayed from the phone.
  implementation "com.google.android.gms:play-services-wearable:18.2.0"
  // RemoteActivityHelper — opens the phone app from the watch ("create
  // from phone").
  implementation "androidx.wear:wear-remote-interactions:1.0.0"
  // Coil — loads player photos in the players list.
  implementation "io.coil-kt:coil-compose:2.7.0"

  // Wear Tile — adaptive swipe-away surface (TeamderTileService).
  // Tile API + ProtoLayout primitives (Compose can't be used in tiles).
  implementation "androidx.wear.tiles:tiles:1.4.0"
  implementation "androidx.wear.protolayout:protolayout:1.2.0"
  implementation "androidx.wear.protolayout:protolayout-expression:1.2.0"
  implementation "androidx.wear.protolayout:protolayout-material:1.2.0"
  // Guava ListenableFuture — Tile request callbacks return it.
  implementation "com.google.guava:guava:33.0.0-android"
}
