// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
    // joryio-session-restore-patch
    configurations.configureEach {
        resolutionStrategy.force 'io.joryio:joryio-android:1.3.0-beta.1-teamder.1'
        resolutionStrategy.dependencySubstitution {
            substitute module('io.joryio:joryio-android:1.3.0-beta.1') using module('io.joryio:joryio-android:1.3.0-beta.1-teamder.1')
        }
    }
  repositories {
        maven { url = uri(new File(rootDir, '../vendor/joryio/releases/android-1.3.0-beta.1-teamder.1')) }
        // joryio-official-maven
        maven { url = uri(new File(rootDir, '../vendor/joryio/releases/android-1.3.0-beta.1')) }
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
