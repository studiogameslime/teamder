<article class="td-invite" dir="rtl" lang="he">
  <style>
    .td-invite{--surface:#fff;--ink:#111827;--muted:#6b7280;--brand:#1e40af;--button-ink:#fff;--line:#e2eaf6;box-sizing:border-box;width:100%;overflow:hidden;border-radius:24px;background:var(--surface);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;text-align:right;border:1px solid var(--line)}
    .td-invite *{box-sizing:border-box}.td-invite .hero{height:172px;position:relative;overflow:hidden;background:#102850}
    .td-invite .stadium{display:block;width:100%;height:100%;object-fit:cover;object-position:center 55%}
    .td-invite .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,55,.06) 15%,rgba(10,26,55,.22) 50%,rgba(10,26,55,.88) 100%)}
    .td-invite .hero-caption{position:absolute;bottom:21px;right:24px;left:24px;display:flex;align-items:center;gap:9px;color:#fff;font-size:13px;font-weight:600;line-height:20px}
    .td-invite .hero-mark{display:flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24)}
    .td-invite .body{padding:25px 24px 22px}.td-invite .eyebrow{display:flex;align-items:center;gap:6px;color:var(--brand);font-size:12px;font-weight:700;line-height:18px;margin:0 0 12px}
    .td-invite .eyebrow svg{flex:none}.td-invite h1{font-size:27px;line-height:1.24;font-weight:700;margin:0 0 14px}
    .td-invite .copy{font-size:15px;line-height:1.7;color:var(--muted);margin:0 0 24px;max-width:32em}
    .td-invite .cta{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:15px 12px;border-radius:14px;background:var(--brand);color:var(--button-ink);font-size:16px;font-weight:700;line-height:22px;text-decoration:none;box-shadow:0 6px 14px rgba(30,64,175,.16);-webkit-tap-highlight-color:transparent}
    .td-invite .cta:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}.td-invite .cta:active{opacity:.88}.td-invite .cta svg{flex:none}
    .td-invite .note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;line-height:17px;margin:14px 0 0;color:var(--muted)}
    @media(max-width:300px){.td-invite .hero{height:144px}.td-invite .body{padding:21px 20px 20px}.td-invite h1{font-size:24px}.td-invite .copy{font-size:14px;margin-bottom:20px}.td-invite .hero-caption{right:20px;left:20px;bottom:17px}}
    @media(prefers-color-scheme:dark){.td-invite{--surface:#11161d;--ink:#f3f4f6;--muted:#9ca3af;--brand:#3b82f6;--button-ink:#0b0f14;--line:#243042}.td-invite .cta{box-shadow:none}}
  </style>
  <div class="hero" aria-hidden="true">
    <img class="stadium" src="organiser-stadium.jpg" alt="">
    <div class="scrim"></div>
    <div class="hero-caption">
      <span class="hero-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h18v16H3zM12 4v16M3 9h4v6H3M21 9h-4v6h4"/><circle cx="12" cy="12" r="3"/></svg></span>
      <span>החבורה שלך. במגרש אחד.</span>
    </div>
  </div>
  <div class="body">
    <p class="eyebrow"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.4"/><path d="m6.3 10 2.4 2.4 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>החבורה שלך, המועדון שלך</span></p>
    <h1>המועדון מוכן.<br>מביאים את החבורה.</h1>
    <p class="copy">שלח קישור אחד בקבוצת הוואטסאפ שלכם, והחברים יוכלו להצטרף למועדון.</p>
    <a class="cta" href="footy://club-invite/{{ trigger.properties.groupId }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M6 11H4v10h16V11h-2"/></svg><span>שתף הזמנה למועדון</span></a>
    <p class="note"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m10 2 6 2v5c0 4-6 8-6 8s-6-4-6-8V4z"/><path d="m7 9 2 2 4-4"/></svg><span>אתה בוחר למי לשלוח את ההזמנה</span></p>
  </div>
</article>
