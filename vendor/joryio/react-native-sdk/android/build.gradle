buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "io.joryio.reactnative"
    compileSdkVersion 34

    defaultConfig {
        // The native SDK this wraps (packages/sdk-android) declares minSdk 23,
        // and manifest merging takes the MAX across libraries - so the effective
        // floor for any consumer is 23 whatever is written here. This used to
        // claim the native SDK was 21 (audit 2026-09-26, R24); it never was.
        //
        // Kept below the native floor on purpose. A thin bridge must never be
        // the library that RAISES it: 24 here silently made every React Native
        // consumer minSdk 24 and broke the stock RN 0.75 template (which
        // generates 23) with
        //   uses-sdk:minSdkVersion 23 cannot be smaller than version 24
        //   declared in library [:joryio_react-native-sdk]
        // The bridge itself uses no API above 21 - it only forwards calls.
        minSdkVersion 21
        targetSdkVersion 34
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "com.facebook.react:react-android:+"
    // BASE + UI, deliberately. An RN app that installs this package and writes
    // no JavaScript still sees in-app messages, rendered by the native views -
    // the same default Braze's RN SDK ships (api "com.braze:android-sdk-ui").
    // "install the SDK, send a campaign, see it appear" is the thing that
    // decides whether an integration succeeds.
    //
    // The opt-out already works and stays: calling Joryio.onInAppMessage() from
    // JS invokes enableInAppMessages(), which sets the native callback and
    // flips hostHandlesDisplay, so the SDK stops drawing and hands messages to
    // React. An app that wants to render in React gets to; an app that does
    // nothing is not left with a silently dead channel.
    implementation project(':joryio-sdk')
    implementation project(':joryio-sdk-ui')
}
