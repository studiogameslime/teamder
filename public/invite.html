<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Teamder · הזמנה</title>
<meta name="description" content="הצטרף לקהילת כדורגל ב־Teamder" />
<!-- Default OG placeholders. The serveCommunityPage CF rewrites
     these per-group when the page is fetched at /team/{id} so
     WhatsApp / Telegram / Facebook show the community's name + cover
     image as the link preview. Crawlers don't run JS, so SSR is the
     only way to get a per-community preview. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Teamder · הזמנה" />
<meta property="og:description" content="הצטרף לקהילת כדורגל ב־Teamder" />
<meta property="og:image" content="https://teamderfc.web.app/logo.png" />
<meta property="og:locale" content="he_IL" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Teamder · הזמנה" />
<meta name="twitter:description" content="הצטרף לקהילת כדורגל ב־Teamder" />
<meta name="twitter:image" content="https://teamderfc.web.app/logo.png" />
<style>
  :root {
    --blue:#3B82F6;
    --blue-dark:#1D4ED8;
    --gray:#6B7280;
    --bg:#F9FAFB;
    --surface:#FFFFFF;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .card {
    background:var(--surface);
    border-radius:24px;
    padding:36px 28px;
    max-width:420px;
    width:100%;
    box-shadow:0 12px 48px rgba(0,0,0,0.08);
    text-align:center;
  }
  .logo {
    width:104px;
    height:104px;
    margin:0 auto 20px;
    border-radius:28px;
    background:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:54px;
  }
  h1 {
    font-size:24px;
    margin:0 0 10px;
    font-weight:800;
  }
  p.sub {
    color:var(--gray);
    font-size:15px;
    line-height:1.55;
    margin:0 0 28px;
  }
  .btn {
    display:block;
    width:100%;
    padding:15px 20px;
    border-radius:14px;
    border:none;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:12px;
    text-decoration:none;
    text-align:center;
    font-family:inherit;
  }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-primary:hover, .btn-primary:active { background:var(--blue-dark); }
  .btn-secondary {
    background:transparent;
    color:var(--blue);
    border:2px solid var(--blue);
  }
  .note {
    font-size:13px;
    color:var(--gray);
    margin-top:20px;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚽</div>
  <h1 id="title">הוזמנת ל־Teamder</h1>
  <p class="sub" id="subtitle">פתח את הקישור באפליקציה כדי להצטרף.</p>
  <button class="btn btn-primary" id="openBtn" type="button">פתח באפליקציה</button>
  <a class="btn btn-secondary" id="installBtn"
     href="https://play.google.com/store/apps/details?id=com.studiogameslime.soccerapp">
    הורד את האפליקציה
  </a>
  <!-- The Play Store link's `referrer` query param is rewritten in JS
       below to include the invite (e.g. invite_session_<id>). When the
       app is installed via that link, Google Play forwards the value
       to the app on first launch via the Play Install Referrer API,
       so we can recover the invite context after a fresh install. -->

  <p class="note">אם האפליקציה לא מותקנת, הורד אותה מהחנות וחזור לקישור ההזמנה.</p>
</div>

<script>
  // Hosting rewrites /session/* and /team/* to this single file, so we
  // recover the original target via location.pathname.
  var parts = location.pathname.split('/').filter(Boolean);
  var type = parts[0] === 'session' ? 'session' : parts[0] === 'team' ? 'team' : null;
  var id = parts[1] || '';
  var invitedBy = (new URLSearchParams(location.search).get('invitedBy') || '').trim();

  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('subtitle');
  if (type === 'session') {
    titleEl.textContent = 'הוזמנת למשחק ב־Teamder';
    subEl.textContent = 'משחק שכונתי מחכה לך. ראה מי מגיע והצטרף בלחיצה אחת.';
  } else if (type === 'team') {
    titleEl.textContent = 'הוזמנת לקבוצה ב־Teamder';
    subEl.textContent = 'הצטרף לקבוצה קבועה וקבל עדכונים על משחקים חדשים.';
  }

  function deepLink() {
    if (!type || !id) return null;
    var query = invitedBy ? '?invitedBy=' + encodeURIComponent(invitedBy) : '';
    // We use the `footy://` scheme rather than `teamder://` because
    // every shipped build of the app has registered `footy` since
    // launch, while `teamder` was only added later and isn't present
    // in installed copies of older versions. The app's deep-link
    // parser accepts both, so this gives us universal coverage with
    // no client-side branching.
    return 'footy://' + type + '/' + encodeURIComponent(id) + query;
  }

  // Persist invite in localStorage as a belt-and-suspenders cache.
  // Mainly useful for the *web* re-visit flow (user returns to this
  // page in the same browser session) — the app side relies on the
  // Play Install Referrer below for cross-install recovery.
  if (type && id) {
    try {
      var cached = { type: type, id: id };
      if (invitedBy) cached.invitedBy = invitedBy;
      localStorage.setItem('pendingInvite', JSON.stringify(cached));
    } catch (_) { /* private mode / quota — non-fatal */ }
  }

  // Append `referrer=invite_<type>_<id>[_by_<uid>]` to the Play Store
  // link. The Play Install Referrer API delivers this verbatim to the
  // freshly installed app on first launch, letting
  // installReferrerService recover the invite context AND the
  // inviter's id after the install.
  if (type && id) {
    var installEl = document.getElementById('installBtn');
    var ref = 'invite_' + type + '_' + encodeURIComponent(id);
    if (invitedBy) ref += '_by_' + encodeURIComponent(invitedBy);
    installEl.href =
      'https://play.google.com/store/apps/details?id=com.studiogameslime.soccerapp' +
      '&referrer=' + encodeURIComponent(ref);
  }

  // iOS has no Play Install Referrer — point the install button at the
  // App Store instead of Google Play so non-installed users can download.
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent || '')) {
    var iosInstallEl = document.getElementById('installBtn');
    if (iosInstallEl) {
      iosInstallEl.href = 'https://apps.apple.com/app/id6775178022';
    }
  }

  // Manual fallback — also kept as a click handler in case the
  // auto-redirect below doesn't fire (private-mode quirks, no JS in
  // some embedded webviews, etc.). The buttons stay visible during
  // the brief window before the auto-redirect kicks in.
  document.getElementById('openBtn').addEventListener('click', function () {
    var url = deepLink();
    if (url) location.href = url;
  });

  // ── Auto-redirect ────────────────────────────────────────────────
  // Goal: skip this landing page entirely on mobile. If the app is
  // installed, open it. If not, send the user straight to the store
  // (with the install-referrer wired up below).
  //
  // Android: use an `intent://...` URL. Chrome resolves it natively:
  // tries the `footy://` scheme via the declared package; if the app
  // isn't installed, follows the `S.browser_fallback_url=` parameter
  // to the Play Store. One redirect, no flicker, no JS timeout.
  //
  // iOS Safari: doesn't understand intent URLs. Best-effort fallback
  // pattern: assign `location.href = footy://...`. If the app is
  // installed, the OS hijacks navigation and we leave the page.
  // Otherwise we land on a "page not found" non-event in Safari — so
  // we set a short timer and, if the page is still alive after it
  // fires, force-redirect to the App Store (APP_STORE_URL_IOS below).
  //
  // Desktop: no auto-redirect. The user might be reading the page
  // on a laptop and a forced store-redirect is hostile there.
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isMobile = isAndroid || isIOS;
  var APP_STORE_URL_IOS = 'https://apps.apple.com/app/id6775178022';
  var PLAY_PACKAGE = 'com.studiogameslime.soccerapp';

  function autoRedirect() {
    if (!type || !id) return;
    if (!isMobile) return;
    var query = invitedBy ? '?invitedBy=' + encodeURIComponent(invitedBy) : '';
    var path = type + '/' + encodeURIComponent(id) + query;
    var installEl = document.getElementById('installBtn');
    var storeUrl = installEl ? installEl.href : null;
    if (isAndroid) {
      // Chrome on Android handles the fallback internally — no JS
      // timer needed. Other Android browsers fall back to the JS
      // pattern below.
      var isChrome =
        /Chrome\/[0-9]/.test(ua) &&
        !/EdgA|EdgiOS|OPR|SamsungBrowser/.test(ua);
      if (isChrome && storeUrl) {
        var intentUrl =
          'intent://' + path +
          '#Intent;scheme=footy;package=' + PLAY_PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(storeUrl) +
          ';end';
        location.replace(intentUrl);
        return;
      }
    }
    // Non-Chrome / iOS: try the deep link; if the page is still
    // alive a moment later, the app didn't intercept → send the
    // user to the store. visibilitychange fires when the OS
    // backgrounds the page (i.e. the app actually opened) — clear
    // the timer in that case so we don't redirect on top of the
    // newly-opened app.
    var fallbackUrl = isIOS ? APP_STORE_URL_IOS : storeUrl;
    var timer = setTimeout(function () {
      if (fallbackUrl) location.replace(fallbackUrl);
    }, 1500);
    document.addEventListener('visibilitychange', function onHide() {
      if (document.hidden) {
        clearTimeout(timer);
        document.removeEventListener('visibilitychange', onHide);
      }
    });
    location.href = 'footy://' + path;
  }

  // Defer one tick so the install-referrer wiring above (which
  // builds `installEl.href`) lands before we read it.
  setTimeout(autoRedirect, 0);
</script>
</body>
</html>
