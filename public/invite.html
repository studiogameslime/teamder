<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Teamder · הזמנה</title>
<meta name="description" content="הצטרף לקהילת כדורגל ב־Teamder" />
<!-- Default OG placeholders. The serveCommunityPage CF rewrites
     these per-group when the page is fetched at /team/{id} so
     WhatsApp / Telegram / Facebook show the community's name + cover
     image as the link preview. Crawlers don't run JS, so SSR is the
     only way to get a per-community preview. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Teamder · הזמנה" />
<meta property="og:description" content="הצטרף לקהילת כדורגל ב־Teamder" />
<meta property="og:image" content="https://teamderfc.web.app/logo.png" />
<meta property="og:locale" content="he_IL" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Teamder · הזמנה" />
<meta name="twitter:description" content="הצטרף לקהילת כדורגל ב־Teamder" />
<meta name="twitter:image" content="https://teamderfc.web.app/logo.png" />
<style>
  :root {
    --blue:#3B82F6;
    --blue-dark:#1D4ED8;
    --gray:#6B7280;
    --bg:#F9FAFB;
    --surface:#FFFFFF;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .card {
    background:var(--surface);
    border-radius:24px;
    padding:36px 28px;
    max-width:420px;
    width:100%;
    box-shadow:0 12px 48px rgba(0,0,0,0.08);
    text-align:center;
  }
  .logo {
    width:104px;
    height:104px;
    margin:0 auto 20px;
    border-radius:28px;
    background:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:54px;
  }
  h1 {
    font-size:24px;
    margin:0 0 10px;
    font-weight:800;
  }
  p.sub {
    color:var(--gray);
    font-size:15px;
    line-height:1.55;
    margin:0 0 28px;
  }
  .btn {
    display:block;
    width:100%;
    padding:15px 20px;
    border-radius:14px;
    border:none;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:12px;
    text-decoration:none;
    text-align:center;
    font-family:inherit;
  }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-primary:hover, .btn-primary:active { background:var(--blue-dark); }
  .btn-secondary {
    background:transparent;
    color:var(--blue);
    border:2px solid var(--blue);
  }
  .note {
    font-size:13px;
    color:var(--gray);
    margin-top:20px;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚽</div>
  <h1 id="title">הוזמנת ל־Teamder</h1>
  <p class="sub" id="subtitle">פתח את הקישור באפליקציה כדי להצטרף.</p>
  <button class="btn btn-primary" id="openBtn" type="button">פתח באפליקציה</button>
  <a class="btn btn-secondary" id="installBtn"
     href="https://play.google.com/store/apps/details?id=com.studiogameslime.soccerapp">
    הורד את האפליקציה
  </a>
  <!-- The Play Store link's `referrer` query param is rewritten in JS
       below to include the invite (e.g. invite_session_<id>). When the
       app is installed via that link, Google Play forwards the value
       to the app on first launch via the Play Install Referrer API,
       so we can recover the invite context after a fresh install. -->

  <p class="note">אם האפליקציה לא מותקנת, הורד אותה מהחנות וחזור לקישור ההזמנה.</p>
</div>

<script>
  // Hosting rewrites /session/* and /team/* to this single file, so we
  // recover the original target via location.pathname.
  var parts = location.pathname.split('/').filter(Boolean);
  var type = parts[0] === 'session' ? 'session'
           : parts[0] === 'team' ? 'team'
           : parts[0] === 'app' ? 'app'
           : parts[0] === 'go' ? 'go'
           : null;
  var id = parts[1] || '';
  var qp = new URLSearchParams(location.search);
  var invitedBy = (qp.get('invitedBy') || '').trim();
  // UTM acquisition params from the Pulse ad-link builder.
  var source = (qp.get('s') || qp.get('utm_source') || '').trim();
  var campaign = (qp.get('c') || qp.get('utm_campaign') || '').trim();
  var gameTarget = (qp.get('g') || '').trim();
  var linkId = (qp.get('l') || '').trim();

  // Click beacon — count people who tapped a tracked link + reached the
  // page, before any redirect. Fire-and-forget; never blocks navigation.
  // Fires for ad/campaign links (source/linkId) AND personal invite links
  // (invitedBy) so a user's "link clicks" can be counted per inviter.
  if (source || linkId || invitedBy) {
    try {
      var beacon = '/track-click?l=' + encodeURIComponent(linkId) +
        '&s=' + encodeURIComponent(source) +
        '&inviter=' + encodeURIComponent(invitedBy);
      if (navigator.sendBeacon) navigator.sendBeacon(beacon);
      else fetch(beacon, { mode: 'no-cors', keepalive: true });
    } catch (_) { /* non-fatal */ }
  }
  // 'app' / 'go' = generic "open the app" (no path target). 'go' is the
  // dedicated acquisition entry; it may still carry `g=<gameId>` to deep
  // link into a game. Both carry invitedBy/source for attribution.
  var isApp = type === 'app' || type === 'go';
  var valid = !!type && (isApp || !!id);
  var pathPart = type === 'go' ? 'go'
               : isApp ? 'app'
               : type + '/' + encodeURIComponent(id);

  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('subtitle');
  if (type === 'session') {
    titleEl.textContent = 'הוזמנת למשחק ב־Teamder';
    subEl.textContent = 'משחק שכונתי מחכה לך. ראה מי מגיע והצטרף בלחיצה אחת.';
  } else if (type === 'team') {
    titleEl.textContent = 'הוזמנת לקבוצה ב־Teamder';
    subEl.textContent = 'הצטרף לקבוצה קבועה וקבל עדכונים על משחקים חדשים.';
  } else if (isApp) {
    titleEl.textContent = 'הוזמנת ל־Teamder';
    subEl.textContent = 'האפליקציה לארגון משחקי כדורגל בלי בלגן. הורד ובוא לשחק.';
  }

  // Build the query string carried into the app (deep link + clipboard),
  // preserving inviter + UTM source/campaign + optional game target.
  function appQuery() {
    var p = [];
    if (invitedBy) p.push('invitedBy=' + encodeURIComponent(invitedBy));
    if (source) p.push('s=' + encodeURIComponent(source));
    if (campaign) p.push('c=' + encodeURIComponent(campaign));
    if (gameTarget) p.push('g=' + encodeURIComponent(gameTarget));
    return p.length ? '?' + p.join('&') : '';
  }

  function deepLink() {
    if (!valid) return null;
    var query = appQuery();
    // We use the `footy://` scheme rather than `teamder://` because
    // every shipped build of the app has registered `footy` since
    // launch, while `teamder` was only added later and isn't present
    // in installed copies of older versions. The app's deep-link
    // parser accepts both, so this gives us universal coverage with
    // no client-side branching.
    return 'footy://' + pathPart + query;
  }

  // Persist invite in localStorage as a belt-and-suspenders cache.
  // Mainly useful for the *web* re-visit flow (user returns to this
  // page in the same browser session) — the app side relies on the
  // Play Install Referrer below for cross-install recovery.
  if (valid) {
    try {
      var cached = isApp ? { type: 'app' } : { type: type, id: id };
      if (invitedBy) cached.invitedBy = invitedBy;
      localStorage.setItem('pendingInvite', JSON.stringify(cached));
    } catch (_) { /* private mode / quota — non-fatal */ }
  }

  // Append `referrer=invite_<type>_<id>[_by_<uid>]` (or `invite_app_by_<uid>`
  // for a generic app invite) to the Play Store link. The Play Install
  // Referrer API delivers it verbatim to the freshly installed app on
  // first launch, letting installReferrerService recover the inviter.
  if (valid) {
    var installEl = document.getElementById('installBtn');
    var ref;
    if (source) {
      // Acquisition link → standard UTM referrer the app parses into
      // `acquisition`. Includes the game target (if any) so the install
      // can still deep-link into it.
      var u = ['utm_source=' + encodeURIComponent(source)];
      if (campaign) u.push('utm_campaign=' + encodeURIComponent(campaign));
      var gForRef = gameTarget || (type === 'session' ? id : '');
      if (gForRef) u.push('g=' + encodeURIComponent(gForRef));
      ref = u.join('&');
    } else {
      ref = isApp ? 'invite_app' : 'invite_' + type + '_' + encodeURIComponent(id);
      if (invitedBy) ref += '_by_' + encodeURIComponent(invitedBy);
    }
    installEl.href =
      'https://play.google.com/store/apps/details?id=com.studiogameslime.soccerapp' +
      '&referrer=' + encodeURIComponent(ref);
  }

  // iOS has no Play Install Referrer — point the install button at the
  // App Store instead of Google Play so non-installed users can download.
  // AND copy the invite URL to the clipboard on tap: Apple gives us no
  // way to carry the inviter through a fresh App Store install, so the
  // freshly launched app recovers it from the clipboard
  // (clipboardInviteService). The write MUST happen inside the tap
  // handler — Safari blocks programmatic clipboard writes without a user
  // gesture — which is also why we don't auto-redirect iOS to the store.
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent || '')) {
    var iosInstallEl = document.getElementById('installBtn');
    if (iosInstallEl) {
      iosInstallEl.href = 'https://apps.apple.com/app/id6775178022';
      if (valid) {
        iosInstallEl.addEventListener('click', function () {
          // Fire-and-forget clipboard write of the canonical invite URL
          // (location.href is https://teamderfc.web.app/<type>/<id>?invitedBy=<uid>,
          // exactly what the app's parseInviteUrl() reads). We do NOT
          // preventDefault and do NOT defer navigation: iOS Safari blocks
          // any location change that runs AFTER an async clipboard promise
          // resolves (the user gesture is already spent), which made the
          // button appear dead. Letting the <a>'s own gesture-backed
          // navigation to the App Store proceed keeps the button working;
          // the synchronous write still rides along for attribution.
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(location.href);
            }
          } catch (_) { /* non-fatal — navigation proceeds regardless */ }
        });
      }
    }
  }

  // "פתח באפליקציה" — try to open the installed app via the custom
  // scheme. If nothing takes over within a short window the app isn't
  // installed → send the user to the right store instead of leaving
  // them stuck on Safari's "address invalid" dialog (iOS shows that for
  // an unhandled `footy://`). visibilitychange firing means the app
  // actually opened — cancel the store fallback so we don't redirect on
  // top of it. (The proper long-term fix is Universal Links, which lets
  // the https invite link open the app directly with no custom scheme.)
  document.getElementById('openBtn').addEventListener('click', function () {
    var url = deepLink();
    if (!url) return;
    var ua2 = navigator.userAgent || '';
    var iOS = /iPhone|iPad|iPod/i.test(ua2);
    var installEl2 = document.getElementById('installBtn');
    var store = iOS
      ? 'https://apps.apple.com/app/id6775178022'
      : (installEl2 ? installEl2.href : '');
    var opened = false;
    var fallback = setTimeout(function () {
      if (!opened && store) { opened = true; location.href = store; }
    }, 1500);
    document.addEventListener('visibilitychange', function vc() {
      if (document.hidden) {
        opened = true;
        clearTimeout(fallback);
        document.removeEventListener('visibilitychange', vc);
      }
    });
    location.href = url;
  });

  // ── Auto-redirect ────────────────────────────────────────────────
  // Goal: skip this landing page entirely on mobile. If the app is
  // installed, open it. If not, send the user straight to the store
  // (with the install-referrer wired up below).
  //
  // Android: use an `intent://...` URL. Chrome resolves it natively:
  // tries the `footy://` scheme via the declared package; if the app
  // isn't installed, follows the `S.browser_fallback_url=` parameter
  // to the Play Store. One redirect, no flicker, no JS timeout.
  //
  // iOS Safari: doesn't understand intent URLs. Best-effort fallback
  // pattern: assign `location.href = footy://...`. If the app is
  // installed, the OS hijacks navigation and we leave the page.
  // Otherwise we land on a "page not found" non-event in Safari — so
  // we set a short timer and, if the page is still alive after it
  // fires, force-redirect to the App Store (APP_STORE_URL_IOS below).
  //
  // Desktop: no auto-redirect. The user might be reading the page
  // on a laptop and a forced store-redirect is hostile there.
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isMobile = isAndroid || isIOS;
  var APP_STORE_URL_IOS = 'https://apps.apple.com/app/id6775178022';
  var PLAY_PACKAGE = 'com.studiogameslime.soccerapp';

  function autoRedirect() {
    if (!valid) return;
    if (!isMobile) return;
    var query = invitedBy ? '?invitedBy=' + encodeURIComponent(invitedBy) : '';
    var path = pathPart + query;
    var installEl = document.getElementById('installBtn');
    var storeUrl = installEl ? installEl.href : null;
    if (isAndroid) {
      // Chrome on Android handles the fallback internally — no JS
      // timer needed. Other Android browsers fall back to the JS
      // pattern below.
      var isChrome =
        /Chrome\/[0-9]/.test(ua) &&
        !/EdgA|EdgiOS|OPR|SamsungBrowser/.test(ua);
      if (isChrome && storeUrl) {
        var intentUrl =
          'intent://' + path +
          '#Intent;scheme=footy;package=' + PLAY_PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(storeUrl) +
          ';end';
        location.replace(intentUrl);
        return;
      }
      // Non-Chrome / in-app webview (WhatsApp, Instagram, Facebook, …):
      // intent:// and custom-scheme deep links are unreliable in those
      // embedded browsers, so go STRAIGHT to the Play Store (the install
      // referrer is already baked into storeUrl). Reliable everywhere —
      // no flicker, no deep-link error dialog.
      if (storeUrl) {
        location.replace(storeUrl);
        return;
      }
    }
    // iOS: do NOT auto-redirect. The clipboard write that carries the
    // inviter through a fresh install needs the user's tap on "install"
    // (Safari blocks gesture-less clipboard writes), so we leave the page
    // in place and let the visible buttons drive: "open in app" fires the
    // deep link for installed users, "install" copies the invite then
    // goes to the store. (Android is fully handled above; desktop is
    // guarded out at the top — so only iOS reaches here.)
  }

  // Defer one tick so the install-referrer wiring above (which
  // builds `installEl.href`) lands before we read it.
  setTimeout(autoRedirect, 0);
</script>
</body>
</html>
